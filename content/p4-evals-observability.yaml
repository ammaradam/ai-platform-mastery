    quiz:
      - q: Which is NOT one of SEA-HELM's five pillars?
        options: ["SEA Culture", "Safety", "SEA Linguistics", "Code generation"]
        answer: 3
        explain: The pillars are NLP Classics, LLM-specifics, SEA Linguistics, SEA Culture and Safety.
      - q: What does MalayMMLU mainly measure?
        options: ["Conversational code-switching", "Knowledge across Malaysian curriculum subjects via multiple choice", "Speech recognition", "Agent tool use"]
        answer: 1
        explain: It's an MCQ knowledge benchmark, not a conversational one.
      - q: A main risk of machine-translating an English benchmark into BM is...
        options: ["It's too expensive", "Translationese and loss of local cultural context", "BM has no grammar", "Models refuse BM"]
        answer: 1
        explain: Translated items often don't reflect how Malaysians actually write.
      - q: A user writes in Manglish and the assistant replies in formal English. Which failure is this?
        options: ["Hallucination", "Language fidelity", "Retrieval failure", "Latency"]
        answer: 1
        explain: The reply doesn't match the user's language or register.
      - q: You validated your judge on English data with TPR 0.92. What should you do before using it on BM traces?
        options: ["Nothing", "Validate it separately on native-labelled BM data", "Translate traces to English", "Raise the threshold"]
        answer: 1
        explain: Judge reliability varies by language; measure per slice.
      - q: Why is safety evaluation in BM important even if English safety evals pass?
        options: ["It isn't", "Guardrails and refusals can be weaker in non-English languages", "BM is banned", "Only for regulators"]
        answer: 1
        explain: Safety behaviour does not reliably transfer across languages.
